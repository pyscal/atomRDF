name: rdf
channels:
  - conda-forge
dependencies:
  # Python
  - python >=3.9, <3.13
  # Core runtime (matches setup.py install_requires)
  - numpy
  - pandas
  - ase
  - pyscal3 >=3.1.12
  - spglib
  - mendeleev
  - rdflib
  - tools4rdf
  - pydantic
  - pyyaml
  - graphviz
  - python-graphviz
  # Optional / extras (covers materials_project, grainboundary, dislocation, oxigraph, sqlalchemy)
  - mp-api
  - aimsgb
  - pymatgen
  # - atomman          # not on conda-forge; install via pip if needed
  - sqlalchemy
  # Triple-store backends
  - pip
  # Notebook / dev tooling (not required at runtime)
  - jupyterlab
  - ipywidgets
  - plotly
  - pip:
    - oxrdflib
    # - atomman
